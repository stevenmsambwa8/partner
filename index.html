<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIFA World Cup 2026</title>

<style>
body{
  background:#08142d;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

h1{
  text-align:center;
}

select{
  width:100%;
  padding:12px;
  margin:20px 0;
  border-radius:8px;
  border:none;
}

.team{
  display:flex;
  align-items:center;
  gap:12px;
  background:#102040;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
}

.team img{
  width:50px;
  height:35px;
  object-fit:cover;
}

.loading{
  text-align:center;
  padding:20px;
}
</style>
</head>
<body>

<h1>⚽ FIFA World Cup 2026</h1>

<select id="groupSelect">
  <option>A</option>
  <option>B</option>
  <option>C</option>
  <option>D</option>
  <option>E</option>
  <option>F</option>
  <option>G</option>
  <option>H</option>
  <option>I</option>
  <option>J</option>
  <option>K</option>
  <option>L</option>
</select>

<div id="teams">
  <div class="loading">Loading...</div>
</div>

<script>

const teamsEl = document.getElementById("teams");
const groupSelect = document.getElementById("groupSelect");

async function loadTeams(group="A") {

  teamsEl.innerHTML =
    '<div class="loading">Loading...</div>';

  try {

    const res = await fetch(
      `/api/teams?group=${group}`
    );

    const data = await res.json();

    const teams = data.teams || [];

    teamsEl.innerHTML = teams.map(team => `
      <div class="team">
        <img src="${team.flag}" alt="">
        <div>
          <strong>${team.name_en}</strong><br>
          FIFA Code: ${team.fifa_code}
        </div>
      </div>
    `).join("");

  } catch(err) {

    teamsEl.innerHTML =
      `<div class="loading">${err}</div>`;

  }
}

groupSelect.addEventListener(
  "change",
  () => loadTeams(groupSelect.value)
);

loadTeams();

</script>

</body>
</html>
