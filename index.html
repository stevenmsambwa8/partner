<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
}

.section{
    margin-top:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:12px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:15px;
}

.loading{
    text-align:center;
    opacity:.7;
}
</style>
</head>
<body>

<h1>⚽ FIFA World Cup 2026</h1>

<div class="section">
    <h2>Groups</h2>
    <div id="groups" class="grid">
        <div class="loading">Loading groups...</div>
    </div>
</div>

<div class="section">
    <h2>Teams</h2>
    <div id="teams" class="grid">
        <div class="loading">Loading teams...</div>
    </div>
</div>

<div class="section">
    <h2>Matches</h2>
    <div id="matches" class="grid">
        <div class="loading">Loading matches...</div>
    </div>
</div>

<script>

async function loadGroups() {
    try {
        const res = await fetch(
            "https://worldcup26.ir/get/groups"
        );

        const data = await res.json();

        document.getElementById("groups").innerHTML =
            data.map(group => `
                <div class="card">
                    <h3>${group.name}</h3>
                </div>
            `).join("");

    } catch (err) {
        console.error(err);
    }
}

async function loadTeams() {
    try {
        const res = await fetch(
            "https://worldcup26.ir/get/teams"
        );

        const data = await res.json();

        document.getElementById("teams").innerHTML =
            data.map(team => `
                <div class="card">
                    <strong>${team.name}</strong>
                </div>
            `).join("");

    } catch (err) {
        console.error(err);
    }
}

async function loadMatches() {
    try {
        const res = await fetch(
            "https://worldcup26.ir/get/games"
        );

        const data = await res.json();

        document.getElementById("matches").innerHTML =
            data.map(match => `
                <div class="card">
                    <strong>
                        ${match.homeTeam}
                        vs
                        ${match.awayTeam}
                    </strong>

                    <br><br>

                    <small>
                        ${match.date || "TBA"}
                    </small>
                </div>
            `).join("");

    } catch (err) {
        console.error(err);
    }
}

loadGroups();
loadTeams();
loadMatches();

</script>

</body>
</html>
