<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Cup 2026 Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#08142d;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    padding:20px;
    text-align:center;
    background:#102040;
}

nav{
    display:flex;
    gap:10px;
    padding:15px;
    overflow:auto;
}

button{
    border:none;
    background:#1a2f5a;
    color:#fff;
    padding:12px 16px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
}

button:hover{
    background:#28447f;
}

#status{
    padding:15px;
    color:#9fb4e8;
}

#content{
    padding:15px;
}

pre{
    background:#111827;
    padding:15px;
    border-radius:12px;
    overflow:auto;
    white-space:pre-wrap;
    word-break:break-word;
}
</style>
</head>
<body>

<header>
    <h1>⚽ FIFA World Cup 2026</h1>
    <p>Powered by your Vercel proxy</p>
</header>

<nav>
    <button onclick="loadData('get/groups')">
        Groups
    </button>

    <button onclick="loadData('get/teams?group=A')">
        Group A Teams
    </button>

    <button onclick="loadData('get/teams?group=B')">
        Group B Teams
    </button>

    <button onclick="loadData('get/games')">
        Matches
    </button>

    <button onclick="loadData('get/stadiums')">
        Stadiums
    </button>

    <button onclick="loadData('api/health')">
        Health
    </button>
</nav>

<div id="status">
    Ready
</div>

<div id="content">
    Select an endpoint above.
</div>

<script>

const statusBox =
    document.getElementById("status");

const contentBox =
    document.getElementById("content");

async function loadData(endpoint){

    try{

        statusBox.innerHTML =
            "Loading: " + endpoint;

        contentBox.innerHTML =
            "Loading...";

        const url =
            "/api/worldcup?endpoint=" +
            encodeURIComponent(endpoint);

        const response =
            await fetch(url);

        const text =
            await response.text();

        statusBox.innerHTML =
            "HTTP " + response.status;

        try{

            const json =
                JSON.parse(text);

            contentBox.innerHTML =
                "<pre>" +
                JSON.stringify(
                    json,
                    null,
                    2
                ) +
                "</pre>";

        }catch{

            contentBox.innerHTML =
                "<pre>" +
                text +
                "</pre>";

        }

    }catch(error){

        statusBox.innerHTML =
            "Error";

        contentBox.innerHTML =
            "<pre>" +
            error +
            "</pre>";

    }

}

loadData("api/health");

</script>

</body>
</html>
