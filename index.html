<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Cup Teams</title>

<style>
body{
    background:#08142d;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

#status{
    margin-bottom:20px;
    padding:10px;
    background:#111;
    border-radius:8px;
}

.team{
    display:flex;
    align-items:center;
    gap:10px;
    background:#102040;
    margin-bottom:10px;
    padding:10px;
    border-radius:10px;
}

.team img{
    width:40px;
    height:30px;
    object-fit:cover;
}
</style>
</head>
<body>

<h1>⚽ Group A Teams</h1>

<div id="status">Loading...</div>

<div id="teams"></div>

<script>
async function loadTeams() {

    const status = document.getElementById("status");

    try {

        const res = await fetch(
            "https://worldcup26.ir/get/teams?group=A"
        );

        status.innerHTML =
            "HTTP Status: " + res.status;

        const data = await res.json();

        console.log(data);

        const teams =
            data.teams || data;

        document.getElementById("teams").innerHTML =
            teams.map(team => `
                <div class="team">
                    <img src="${team.flag}">
                    <div>
                        ${team.name_en}
                    </div>
                </div>
            `).join("");

    } catch(err) {

        status.innerHTML =
            "ERROR: " + err;

        console.error(err);

    }
}

loadTeams();
</script>

</body>
</html>
