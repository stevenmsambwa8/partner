<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup API Test</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0b1736;
    color:white;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

#output{
    background:#111;
    padding:15px;
    border-radius:10px;
    white-space:pre-wrap;
    word-break:break-word;
    overflow:auto;
}
</style>
</head>
<body>

<h1>⚽ World Cup API Test</h1>

<div id="output">
Loading...
</div>

<script>

const output = document.getElementById("output");

async function testAPI() {

    try {

        output.innerHTML = "Fetching data...";

        const response = await fetch(
            "https://worldcup26.ir/get/teams"
        );

        output.innerHTML =
            "HTTP Status: " +
            response.status +
            "\n\n";

        const text = await response.text();

        output.innerHTML +=
            "Response:\n\n" +
            text;

    }

    catch(error) {

        output.innerHTML =
            "ERROR:\n\n" +
            error +
            "\n\n" +
            "Fetch failed completely.";

    }

}

testAPI();

</script>

</body>
</html>
